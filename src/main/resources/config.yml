#Voting requires NuVotifier
#https://github.com/8b8tDev/NuVotifier
Vote:
  Rewards:
    - 'lp user %s group add voter'
  OfflineVoteExpirationDays: 7
  VoterRoleExpirationDays: 30
  LegacyPlayerDefaultDaysRemaining: 20
  EnableLegacyPlayerMigration: true
  ExpirationCommand: 'lp user %s group remove voter'
Patch:
  DefaultElytraMaxSpeedBlocksPerSecond: 50
  TileEntitiesElytraMaxSpeedBlocksPerSecond: 64
  ChestLimitPerChunk: 280
  BoundaryProtection:
    Enabled: true
    NetherRoofProtection:
      Enabled: true
      DamagePlayers: false
      BlockPlayers: true
      EnsureSafeTeleport: true
      NetherYLevel: 128
  EntityPerChunk:
    CheckInterval: 1 # minutes
    DefaultMax: 32 # -1 for max
    DroppedItemMinAgeTicks: 6000
    EntitiesPerChunk:
      - 'wither::20'
      - 'boat::10'
      - 'falling_block::200'
      - 'dropped_item::100'
      - 'item_frame::256'
      - 'glow_item_frame::256'
    PhantomFixes:
      Enabled: true
      BlockAll: false
      OnlyInEnd: true
      SpawnAboveBlocks:
        - END_STONE
        - CHORUS_FLOWER
        - CHORUS_PLANT
      DisableScreechUntilAttacked: true
      OnlyHostileIfAttacked: true
Redstone:
    StrictTPS: 14
    StrictMaxVLS: 70 #How many redstone operations per second can happen in strict mode
    RegularMaxVLS: 20000 #How many redstone operations per second can happen in regular mode
